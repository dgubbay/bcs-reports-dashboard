<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>BCS Reports Hub</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                --gold: #c9a227;
                --navy: #0b1a2c;
            }

            * { box-sizing: border-box; }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                background:
                    radial-gradient(ellipse at 50% 0%, #1b3350 0%, var(--navy) 55%, #070e18 100%);
                font-family: "Source Sans 3", "Segoe UI", sans-serif;
                -webkit-font-smoothing: antialiased;
                color: #e8edf4;
            }

            .staticrypt-content::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background-image:
                    radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.35), transparent),
                    radial-gradient(1px 1px at 88% 18%, rgba(255,255,255,0.25), transparent),
                    radial-gradient(1px 1px at 33% 78%, rgba(255,255,255,0.2), transparent),
                    radial-gradient(1px 1px at 70% 64%, rgba(255,255,255,0.25), transparent),
                    radial-gradient(1.5px 1.5px at 52% 30%, rgba(255,255,255,0.3), transparent);
                opacity: 0.7;
            }

            .staticrypt-page {
                width: min(420px, calc(100% - 32px));
                padding: 10vh 0 4rem;
                margin: auto;
                position: relative;
                z-index: 1;
            }

            .staticrypt-form {
                background: rgba(11, 22, 38, 0.82);
                border: 1px solid rgba(201, 162, 39, 0.35);
                border-radius: 18px;
                padding: 2.4rem 2.2rem 2.2rem;
                text-align: center;
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                    0 24px 60px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(10px);
            }

            .crest {
                width: 72px;
                height: 72px;
                margin: 0 auto 1rem;
                color: var(--gold);
            }

            .staticrypt-title {
                font-family: Cinzel, Palatino, serif;
                font-size: 1.7rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                margin: 0 0 0.4rem;
                color: #f4efe2;
            }

            .staticrypt-instructions {
                margin: 0;
            }

            .staticrypt-instructions p:last-child {
                margin: 0 0 1.4rem;
                color: #b7c0ce;
                font-size: 0.98rem;
                line-height: 1.45;
            }

            .staticrypt-hr { display: none; }

            .staticrypt-password-container {
                position: relative;
                background: #0a1524;
                border: 1px solid rgba(201, 162, 39, 0.35);
                border-radius: 10px;
                width: 100%;
                margin: 0 0 1rem;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                color: #f4efe2;
                font-family: inherit;
                font-size: 16px;
                outline: 0;
                padding: 14px 42px 14px 14px;
                width: 100%;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.7;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.12em;
                outline: 0;
                background: var(--gold);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 14px;
                color: #1a1406;
                font-family: Cinzel, Palatino, serif;
                font-size: 0.95rem;
                font-weight: 700;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--gold);
                filter: brightness(108%);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.7rem;
                margin: 0 0 1.1rem;
                color: #c5cdd8;
                font-size: 0.92rem;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.25);
                accent-color: var(--gold);
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--navy);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid rgba(201, 162, 39, 0.35);
                border-right-color: var(--gold);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>
